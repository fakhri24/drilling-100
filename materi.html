<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materi — Drilling-100</title>
  <link rel="stylesheet" href="css/style.css?v=4">
  <script src="js/theme.js?v=4"></script>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="brand">📐 Drilling-100</a>
    <div class="navbar-right">
      <button id="theme-toggle" class="btn-theme-toggle" onclick="toggleTheme()" aria-label="Ganti tema">🌙</button>
      <div class="user-info" id="nav-user" style="display:none">
        <span id="nav-username"></span>
        <button class="btn-logout" onclick="logout()">Keluar</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="loading" id="loading">Memuat...</div>

    <div id="materi-content" style="display:none">
      <a href="index.html" id="link-kembali" style="font-size:0.9rem; color:var(--text-secondary)">← Semua Materi</a>
      <h1 id="materi-judul" style="margin:12px 0"></h1>
      <p class="subtitle mb-16" id="materi-desc">Pilih kompetensi untuk mulai drilling 100 soal</p>

      <div class="kompetensi-list" id="kompetensi-list"></div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=4"></script>
  <script src="js/auth.js?v=4"></script>
  <script src="js/progres.js?v=4"></script>
  <script src="js/kurikulum.js?v=4"></script>
  <script>
    auth.onAuthStateChanged(async (user) => {
      if (!user) return;

      const username = await getUsername(user.uid);
      const navUser = document.getElementById("nav-user");
      const navUsername = document.getElementById("nav-username");
      navUsername.textContent = username || user.displayName;
      navUser.style.display = "flex";

      // Ambil id sub-materi dari URL. Nilai "01".."12" adalah tautan publik
      // yang dipakai lms-matematika — lihat catatan di js/kurikulum.js.
      const params = new URLSearchParams(window.location.search);
      const found = getSubMateri(params.get("id"));

      if (!found) {
        document.getElementById("loading").innerHTML =
          `Materi tidak ditemukan.<br><a href="index.html">← Kembali</a>`;
        return;
      }

      const { materiUtama, subMateri } = found;
      document.getElementById("materi-judul").textContent =
        `${subMateri.emoji} ${subMateri.nama}`;
      // "Kembali" membawa serta materi utamanya, supaya beranda langsung
      // membuka tab yang benar
      document.getElementById("link-kembali").textContent = `← ${materiUtama.nama}`;
      localStorage.setItem("drilling100_tab", materiUtama.id);

      // Ambil progres siswa
      const allProgres = await getAllProgres(user.uid);

      // Render kompetensi list
      const list = document.getElementById("kompetensi-list");
      subMateri.kompetensi.forEach(k => {
        const progres = allProgres.get(k.id);
        let statusClass = "belum";
        let statusText = "Belum";

        if (progres) {
          if (progres.selesai) {
            statusClass = "selesai";
            statusText = `${progres.totalBenar}/100`;
          } else {
            statusClass = "sedang";
            statusText = `${progres.jawaban ? progres.jawaban.length : 0}/100`;
          }
        }

        const item = document.createElement("a");
        item.className = "kompetensi-item";
        item.href = `drill.html?kompetensi=${k.id}`;
        item.innerHTML = `
          <span class="label">${k.nama}</span>
          <span class="status ${statusClass}">${statusText}</span>
        `;
        list.appendChild(item);
      });

      document.getElementById("loading").style.display = "none";
      document.getElementById("materi-content").style.display = "block";
    });
  </script>
</body>
</html>
