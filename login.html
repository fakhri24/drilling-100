<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Drilling-100</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container" style="max-width:400px; margin-top:80px">
    <div class="text-center mb-16">
      <h1>📐 Drilling-100</h1>
      <p class="subtitle mt-8">Masuk untuk mulai latihan</p>
    </div>

    <div class="card">
      <!-- Google Login -->
      <button class="btn btn-google" onclick="loginWithGoogle().catch(handleError)">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#4285F4" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#34A853" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#EA4335" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Masuk dengan Google
      </button>

      <div class="divider"><span>atau</span></div>

      <!-- Email Login -->
      <form id="email-form" onsubmit="handleEmailSubmit(event)">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="nama@email.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Minimal 6 karakter" required minlength="6">
        </div>
        <div class="error-text" id="error-msg" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-full" id="btn-submit">Masuk</button>
      </form>

      <p class="text-center mt-16" style="font-size:0.9rem">
        <span id="toggle-text">Belum punya akun?</span>
        <a href="#" id="toggle-link" onclick="toggleMode(event)">Daftar</a>
      </p>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    let isSignup = false;

    function toggleMode(e) {
      e.preventDefault();
      isSignup = !isSignup;
      document.getElementById("btn-submit").textContent = isSignup ? "Daftar" : "Masuk";
      document.getElementById("toggle-text").textContent = isSignup ? "Sudah punya akun?" : "Belum punya akun?";
      document.getElementById("toggle-link").textContent = isSignup ? "Masuk" : "Daftar";
      document.getElementById("error-msg").style.display = "none";
    }

    async function handleEmailSubmit(e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorMsg = document.getElementById("error-msg");

      try {
        if (isSignup) {
          await firebase.auth().createUserWithEmailAndPassword(email, password);
        } else {
          await firebase.auth().signInWithEmailAndPassword(email, password);
        }
        window.location.href = "dashboard.html";
      } catch (err) {
        errorMsg.textContent = translateError(err.code);
        errorMsg.style.display = "block";
      }
    }

    function handleError(err) {
      const errorMsg = document.getElementById("error-msg");
      errorMsg.textContent = translateError(err.code);
      errorMsg.style.display = "block";
    }

    function translateError(code) {
      const map = {
        "auth/email-already-in-use": "Email sudah terdaftar",
        "auth/invalid-email": "Format email tidak valid",
        "auth/weak-password": "Password minimal 6 karakter",
        "auth/user-not-found": "Email tidak terdaftar",
        "auth/wrong-password": "Password salah",
        "auth/too-many-requests": "Terlalu banyak percobaan, coba lagi nanti",
        "auth/popup-closed-by-user": "Login dibatalkan",
      };
      return map[code] || "Terjadi kesalahan, coba lagi";
    }

    // Redirect jika sudah login
    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        window.location.href = "dashboard.html";
      }
    });
  </script>
</body>
</html>
