<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drilling — Drilling-100</title>
  <link rel="stylesheet" href="css/style.css?v=4">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="js/theme.js?v=4"></script>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="brand">📐 Drilling-100</a>
    <div class="navbar-right">
      <button id="theme-toggle" class="btn-theme-toggle" onclick="toggleTheme()" aria-label="Ganti tema">🌙</button>
      <div class="user-info" id="nav-user" style="display:none">
        <span id="nav-username"></span>
        <button class="btn-logout" onclick="logout()">Keluar</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="loading" id="loading">Memuat...</div>

    <!-- Drill Area -->
    <div id="drill-area" style="display:none">
      <div class="drill-header">
        <a href="index.html" id="link-kembali" style="font-size:0.9rem; color:var(--text-secondary)">← Kembali</a>
        <div class="drill-counter" id="drill-counter">0 / 100</div>
      </div>

      <h2 id="judul-kompetensi" style="font-size:1rem; margin-bottom:12px; color:var(--text-secondary)"></h2>

      <div class="drill-progress">
        <div class="progress-bar">
          <div class="fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>

      <div class="soal-card">
        <div class="pertanyaan" id="pertanyaan">...</div>
        <input type="text" id="jawaban-input" placeholder="mis. 3, -2, 1/2, atau 0,5"
               autocomplete="off" inputmode="text">
        <div class="pilihan-grid" id="pilihan-area" style="display:none"></div>
        <div class="mt-16">
          <button class="btn btn-primary" id="btn-jawab" onclick="engine.submitJawaban()">Jawab</button>
          <button class="btn btn-primary" id="btn-next" onclick="engine.nextSoal()" style="display:none">Soal Berikutnya →</button>
        </div>
      </div>

      <div id="feedback-area"></div>
    </div>

    <!-- Hasil Area -->
    <div id="hasil-area" style="display:none">
      <div class="card">
        <div class="hasil">
          <div class="skor-besar" id="skor-besar">0</div>
          <div class="skor-label">dari 100 soal benar</div>

          <div class="stat-grid">
            <div class="stat-item">
              <div class="stat-value" id="stat-benar">0</div>
              <div class="stat-label">Benar</div>
            </div>
            <div class="stat-item">
              <div class="stat-value" id="stat-salah">0</div>
              <div class="stat-label">Salah</div>
            </div>
            <div class="stat-item">
              <div class="stat-value" id="stat-akurasi">0%</div>
              <div class="stat-label">Akurasi</div>
            </div>
          </div>

          <a href="index.html" class="btn btn-primary mt-16">Kembali ke Beranda</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=4"></script>
  <script src="js/auth.js?v=4"></script>
  <script src="js/progres.js?v=4"></script>
  <script src="js/kurikulum.js?v=4"></script>
  <script src="js/drill-engine.js?v=4"></script>

  <!-- Materi scripts — load all (registers KOMPETENSI_XX globals) -->
  <script src="js/materi/01-operasi-aritmatika-dasar.js?v=4"></script>
  <script src="js/materi/02-sifat-operasi-bilangan.js?v=4"></script>
  <script src="js/materi/03-kpk-dan-fpb.js?v=4"></script>
  <script src="js/materi/04-operasi-pecahan.js?v=4"></script>
  <script src="js/materi/05-operasi-konversi-desimal.js?v=4"></script>
  <script src="js/materi/06-pengenalan-variabel.js?v=4"></script>
  <script src="js/materi/07-manipulasi-aljabar-dasar.js?v=4"></script>
  <script src="js/materi/08-plsv.js?v=4"></script>
  <script src="js/materi/09-spldv.js?v=4"></script>
  <script src="js/materi/10-persentase.js?v=4"></script>
  <script src="js/materi/11-perbandingan-dan-skala.js?v=4"></script>
  <script src="js/materi/12-pembulatan-dan-estimasi.js?v=4"></script>
  <script src="js/materi/E1-sifat-eksponen-bulat.js?v=4"></script>
  <script src="js/materi/E2-operasi-bentuk-akar.js?v=4"></script>
  <script src="js/materi/E3-merasionalkan-penyebut.js?v=4"></script>
  <script src="js/materi/E4-eksponen-rasional.js?v=4"></script>
  <script src="js/materi/E5-fungsi-eksponen.js?v=4"></script>

  <script>
    // Registry: kompetensiId → config
    const REGISTRY = {};

    // Register semua kompetensi dari materi files
    function registerMateri(list) {
      list.forEach(k => { REGISTRY[k.id] = k; });
    }
    registerMateri(KOMPETENSI_01);
    registerMateri(KOMPETENSI_02);
    registerMateri(KOMPETENSI_03);
    registerMateri(KOMPETENSI_04);
    registerMateri(KOMPETENSI_05);
    registerMateri(KOMPETENSI_06);
    registerMateri(KOMPETENSI_07);
    registerMateri(KOMPETENSI_08);
    registerMateri(KOMPETENSI_09);
    registerMateri(KOMPETENSI_10);
    registerMateri(KOMPETENSI_11);
    registerMateri(KOMPETENSI_12);
    registerMateri(KOMPETENSI_E1);
    registerMateri(KOMPETENSI_E2);
    registerMateri(KOMPETENSI_E3);
    registerMateri(KOMPETENSI_E4);
    registerMateri(KOMPETENSI_E5);

    let engine = null;
    let initialized = false;

    // Keyboard: Enter = Jawab / Next. Didaftarkan sekali saja di top level —
    // auth.onAuthStateChanged bisa terpanggil lebih dari sekali, jadi kalau
    // listener ini didaftarkan di dalamnya, bisa terpasang dobel dan
    // menyebabkan satu Enter memicu submitJawaban() + nextSoal() sekaligus.
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" || !engine) return;
      const btnJawab = document.getElementById("btn-jawab");
      const btnNext = document.getElementById("btn-next");
      if (btnNext.style.display !== "none") {
        e.preventDefault();
        engine.nextSoal();
      } else if (btnJawab.style.display !== "none") {
        e.preventDefault();
        engine.submitJawaban();
      }
    });

    auth.onAuthStateChanged(async (user) => {
      if (!user || initialized) return;
      initialized = true;

      const username = await getUsername(user.uid);
      const navUser = document.getElementById("nav-user");
      const navUsername = document.getElementById("nav-username");
      navUsername.textContent = username || user.displayName;
      navUser.style.display = "flex";

      // Ambil kompetensiId dari URL
      const params = new URLSearchParams(window.location.search);
      const kompetensiId = params.get("kompetensi");

      if (!kompetensiId || !REGISTRY[kompetensiId]) {
        document.getElementById("loading").innerHTML =
          `Kompetensi tidak ditemukan.<br><a href="index.html">← Kembali</a>`;
        return;
      }

      // "Kembali" mengarah ke daftar kompetensi sub-materi ini (bukan daftar
      // semua materi), supaya lanjut ke kompetensi lain di sub-materi yang sama
      const asal = getSubMateriDariKompetensi(kompetensiId);
      if (asal) {
        document.getElementById("link-kembali").href = `materi.html?id=${asal.subMateri.id}`;
        document.getElementById("link-kembali").textContent = `← ${asal.subMateri.nama}`;
      }

      // Init engine
      const config = REGISTRY[kompetensiId];
      engine = new DrillEngine(config);
      await engine.init(user);
    });
  </script>
</body>
</html>
